name: Release CLI

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release-cli:
    name: Build and upload prowl binaries
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3 (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Build prowl (arm64)
        run: |
          swift build -c release --product prowl
          cp .build/release/prowl prowl-macos-arm64
          chmod +x prowl-macos-arm64

      - name: Build prowl (x86_64)
        run: |
          swift build -c release --product prowl --triple x86_64-apple-macosx
          cp .build/x86_64-apple-macosx/release/prowl prowl-macos-x86_64
          chmod +x prowl-macos-x86_64

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            prowl-macos-arm64
            prowl-macos-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
